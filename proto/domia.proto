syntax = "proto3";

package domia;

service DomiaNode {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc DeliverEvent(EventEnvelope) returns (DeliveryAck);
  rpc StreamStt(stream AudioChunk) returns (SttDonePayload);
  rpc StreamLlm(LlmStreamRequest) returns (stream TokenChunk);
  rpc StreamTts(TtsStreamRequest) returns (stream AudioChunk);
  rpc StreamReplyAudio(LlmStreamRequest) returns (stream ReplyAudioMessage);
  rpc StreamVoiceReply(stream AudioChunk) returns (stream ReplyAudioMessage);
  rpc ReportReflection(ReflectionReport) returns (ReflectionAck);
  rpc ReportStageExecution(StageExecutionReport) returns (StageExecutionAck);
  rpc RunInferenceWithTools(InferenceRequest) returns (InferenceResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string domia_id = 2;
  string domia_key = 3;
  int64 server_time_ms = 4;
}

message AudioReadyPayload {
  optional string file_path = 1;
  optional string audio_url = 2;
  optional string origin_domia_key = 3;
  optional string interaction_id = 4;
  optional bytes audio = 5;
}

message SttDonePayload {
  string transcript = 1;
  optional string interaction_id = 2;
  optional string origin_domia_key = 3;
  optional string response_type = 4;
}

message LlmDonePayload {
  string reply = 1;
  optional string interaction_id = 2;
  optional string origin_domia_key = 3;
  optional string response_type = 4;
}

message TtsDonePayload {
  optional string file_path = 1;
  optional string audio_url = 2;
  optional string interaction_id = 3;
  optional string origin_domia_key = 4;
  optional bytes audio = 5;
}

message InteractionFailedPayload {
  string error = 1;
  optional string step = 2;
  optional string interaction_id = 3;
  optional string origin_domia_key = 4;
  optional string response_type = 5;
}

message EventEnvelope {
  string sender_domia_key = 1;
  oneof payload {
    AudioReadyPayload audio_ready = 10;
    SttDonePayload stt_done = 11;
    LlmDonePayload llm_done = 12;
    TtsDonePayload tts_done = 13;
    InteractionFailedPayload interaction_failed = 14;
  }
}

message DeliveryAck {
  bool accepted = 1;
  string reason = 2;
  bool deduplicated = 3;
}

message StreamSttMeta {
  string sender_domia_key = 1;
  optional string origin_domia_key = 2;
  optional string interaction_id = 3;
  optional string response_type = 4;
  optional string persona_context_json = 5;
}

message ReflectionReport {
  string sender_domia_key = 1;
  optional string origin_domia_key = 2;
  optional string interaction_id = 3;
  optional string emotion_delta_json = 4;
  optional string cause = 5;
  optional string facts_json = 6;
  optional string user_emotion_json = 7;
}

message ReflectionAck {
  bool accepted = 1;
}

message StageMetric {
  string stage = 1;
  string executor_domia_key = 2;
  uint32 stage_ms = 3;
  optional string model = 4;
  optional string engine = 5;
  optional string voice = 6;
}

message StageExecutionReport {
  string sender_domia_key = 1;
  optional string origin_domia_key = 2;
  optional string interaction_id = 3;
  repeated StageMetric stages = 4;
}

message StageExecutionAck {
  bool accepted = 1;
}

message AudioChunk {
  bytes pcm = 1;
  optional uint32 sample_rate = 2;
  optional uint32 channels = 3;
  optional StreamSttMeta meta = 4;
}

message TokenChunk {
  string token = 1;
}

message LlmStreamRequest {
  string sender_domia_key = 1;
  string transcript = 2;
  optional string origin_domia_key = 3;
  optional string interaction_id = 4;
  optional string response_type = 5;
  optional string persona_context_json = 6;
}

message InferenceRequest {
  string sender_domia_key = 1;
  string messages_json = 2;
  string tools_json = 3;
  optional string origin_domia_key = 4;
  optional string interaction_id = 5;
  optional string session_id = 6;
}

message InferenceResponse {
  optional string reply = 1;
  optional string tool_calls_json = 2;
}

message TtsStreamRequest {
  string sender_domia_key = 1;
  string reply = 2;
  optional string origin_domia_key = 3;
  optional string interaction_id = 4;
  optional string tts_voice_json = 5;
}

message ReplyAudioMessage {
  oneof payload {
    AudioChunk audio = 1;
    string final_reply = 2;
    string transcript = 3;
  }
}
