services:
  ollama:
    image: ollama/ollama:latest
    container_name: domia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=3
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: domia-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mqtt:/mosquitto/config
      - ./data/mqtt:/mosquitto/data
      - ./log/mqtt:/mosquitto/log
    restart: unless-stopped

  core:
    container_name: domia-core
    build:
      context: ./
      dockerfile: ./Dockerfile
      target: domia-core
    image: domia-core/domia-core
    privileged: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  livekit:
    image: livekit/livekit-server:latest
    container_name: domia-livekit
    profiles: ["lab"]
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

volumes:
  ollama_data:
